name: terraform-deploy-huaweicloud

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, staging, prod]
      action:
        description: "Terraform action"
        required: true
        type: choice
        options: [plan, apply, destroy]
  pull_request:
    branches: [main]
    paths: ["terraform/**"]

# Prevent concurrent state mutations on the same environment.
concurrency:
  group: terraform-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  id-token: write # reserved for future OIDC federation support

env:
  TF_VERSION: "1.7.5"
  TF_WORKING_DIR: terraform
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform:
    name: terraform-${{ inputs.action || 'plan' }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment || 'dev' }} # gates secrets + reviewers
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    # Ephemeral: no persisted runner, no cached job outputs across runs.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init (remote state)
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ inputs.environment || 'dev' }}/terraform.tfstate" \
            -backend-config="region=${{ vars.HW_REGION }}" \
            -backend-config="endpoint=${{ vars.TF_STATE_OBS_ENDPOINT }}" \
            -backend-config="access_key=${{ secrets.HW_ACCESS_KEY }}" \
            -backend-config="secret_key=${{ secrets.HW_SECRET_KEY }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_hw_region: ${{ vars.HW_REGION }}
          TF_VAR_hw_access_key: ${{ secrets.HW_ACCESS_KEY }}
          TF_VAR_hw_secret_key: ${{ secrets.HW_SECRET_KEY }}
          TF_VAR_hw_project_id: ${{ vars.HW_PROJECT_ID }}
          TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
          TF_VAR_environment: ${{ inputs.environment || 'dev' }}
          TF_VAR_availability_zone: ${{ vars.HW_AVAILABILITY_ZONE }}
          TF_VAR_ecs_flavor_id: ${{ vars.ECS_FLAVOR_ID }}
          TF_VAR_ecs_image_id: ${{ vars.ECS_IMAGE_ID }}
        run: terraform plan -out=tfplan -no-color -input=false

      - name: Terraform Apply
        if: inputs.action == 'apply'
        env:
          TF_VAR_hw_region: ${{ vars.HW_REGION }}
          TF_VAR_hw_access_key: ${{ secrets.HW_ACCESS_KEY }}
          TF_VAR_hw_secret_key: ${{ secrets.HW_SECRET_KEY }}
          TF_VAR_hw_project_id: ${{ vars.HW_PROJECT_ID }}
          TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
          TF_VAR_environment: ${{ inputs.environment || 'dev' }}
          TF_VAR_availability_zone: ${{ vars.HW_AVAILABILITY_ZONE }}
          TF_VAR_ecs_flavor_id: ${{ vars.ECS_FLAVOR_ID }}
          TF_VAR_ecs_image_id: ${{ vars.ECS_IMAGE_ID }}
        run: terraform apply -auto-approve -input=false tfplan

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        env:
          TF_VAR_hw_region: ${{ vars.HW_REGION }}
          TF_VAR_hw_access_key: ${{ secrets.HW_ACCESS_KEY }}
          TF_VAR_hw_secret_key: ${{ secrets.HW_SECRET_KEY }}
          TF_VAR_hw_project_id: ${{ vars.HW_PROJECT_ID }}
          TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
          TF_VAR_environment: ${{ inputs.environment || 'dev' }}
          TF_VAR_availability_zone: ${{ vars.HW_AVAILABILITY_ZONE }}
          TF_VAR_ecs_flavor_id: ${{ vars.ECS_FLAVOR_ID }}
          TF_VAR_ecs_image_id: ${{ vars.ECS_IMAGE_ID }}
        run: terraform destroy -auto-approve -input=false

      # Ephemeral hygiene: strip local artifacts even though the runner is
      # torn down after the job; avoids leaking plan/state into caches/logs.
      - name: Cleanup local artifacts
        if: always()
        run: rm -rf .terraform tfplan
